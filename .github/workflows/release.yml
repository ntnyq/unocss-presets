name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Used for create the release and push tags
      contents: write
      # Used for npm provenance
      id-token: write
      # Used for changeset PR
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm run play:build
      - name: Verify generated files are current
        run: git diff --exit-code
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.1
        with:
          commit-message: 'chore: bump versions'
          pr-title: 'chore: bump versions'
          publish-script: pnpm run publish
          version-script: pnpm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
